# Autonomous Base-01 — structural cases, v0.1
# Each case patches the base model, runs one capability-graph query, and
# states the expected verdict and root causes BEFORE the run (pre-registered).
# Run: cargo run -p poie-ontology --bin poie-graph -- scenarios/base-01/cases.toml

schema = "poie.scenario-cases/0.2"
model = "model.toml"

[[case]]
id = "S0"
title = "Baseline: restore water with the spare sleeve"
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["other"]
[case.expect]
verdict = "candidate"
route_includes = ["replace-sleeve-p1"]
route_excludes = ["turn-sleeve-p1"]

[[case]]
id = "S1"
title = "No accepted spare: machine and inspect a sleeve"
description = "lot-sleeve-02 is quarantined and must not be used even though it is physically present."
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }
[case.expect]
verdict = "candidate"
route_includes = ["turn-sleeve-p1", "inspect-sleeve-p1", "replace-sleeve-p1"]

[[case]]
id = "S2"
title = "No spare and lathe failed: the repair needs the lathe itself"
description = """
Viewed separately, each capability exists: the robot can repair the lathe, \
and the lathe can make the nut it needs. Jointly, making the nut requires \
the failed lathe. Expected root cause: cycle on lathe-1."""
goal = { service = "potable-water" }
min_verification = "modeled"
tags = ["cycle"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }
asset_status = { "lathe-1" = "failed" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "cycle", subject = "lathe-1" }]

[[case]]
id = "S3"
title = "Common cause: bus-1 fails"
description = """
A spare sleeve and a spare breaker are both in stock. The pump needs bus-1; \
the only robot that can replace the breaker depends on charger-1, which is \
fed by bus-1. Expected root cause: cycle on bus-1."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["common-cause"]
[case.patch]
asset_status = { "bus-1" = "failed" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "cycle", subject = "bus-1" }]

[[case]]
id = "S4"
title = "Stale pump evidence: unknown is not healthy"
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["unknown"]
[case.patch]
asset_status = { "pump-p1" = "unknown" }
[case.expect]
verdict = "unknown"
root_causes = [{ kind = "unknown_state", subject = "pump-p1" }]

[[case]]
id = "S5"
title = "Machining route only declared, not demonstrated"
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["verification"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }
process_verification = { "turn-sleeve-p1" = "declared" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "below_verification", subject = "turn-sleeve-p1" }]

[[case]]
id = "S6"
title = "Not enough bronze bar"
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item", "lot-bronze" = "1 kg" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "bronze-bar" }]

[[case]]
id = "S7"
title = "Cutting inserts exhausted: irreducible external dependency"
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item", "lot-insert" = "0 item" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "cutting-insert" }]

[[case]]
id = "S8"
title = "Two sleeves: one from stock, one manufactured"
goal = { obtain = { resource = "sleeve-p1", quantity = "2 item" } }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.expect]
verdict = "candidate"
route_includes = ["turn-sleeve-p1", "inspect-sleeve-p1"]

[[case]]
id = "S9"
title = "Four sleeves: bronze runs out on the third machined part"
description = "1 from stock + 3 machined needs 3.6 kg bronze; 3 kg in stock. Guards against double allocation."
goal = { obtain = { resource = "sleeve-p1", quantity = "4 item" } }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "bronze-bar" }]

[[case]]
id = "S10"
title = "Energy budget too small for the machining route"
description = "Turning 2 kWh + inspection 0.1 kWh + replacement 0.5 kWh = 2.6 kWh > 2 kWh stored."
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item", "lot-energy" = "2 kWh" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "electric-energy" }]

# --- M2.1 OR support (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S11"
title = "S3 with an emergency feed: OR support breaks the common-cause cycle"
description = """
The improvement direction recorded in v0.1 §6: charger-1 accepts either the \
main bus or a standby feed. With bus-1 failed but the standby feed available, \
the robot can still replace the bus breaker, after which the pump can be \
repaired. Expected: candidate via replace-bus-breaker, then replace-sleeve-p1. \
Base-01 v0.1 model is unchanged; the standby feed exists only in this case."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["common-cause"]
[case.patch]
asset_status = { "bus-1" = "failed" }
asset_requires = { "charger-1" = [] }
asset_requires_any = { "charger-1" = ["bus-1", "emergency-bus"] }

[[case.patch.add_asset]]
id = "emergency-bus"
kind = "power-bus"
status = "available"
description = "Standby feed for charger-1, case-only. Not part of the v0.1 base model."

[case.expect]
verdict = "candidate"
route_includes = ["replace-bus-breaker", "replace-sleeve-p1"]

[[case]]
id = "S12"
title = "Same OR support, but both alternatives are unusable"
description = """
Negative control for S11: bus-1 is failed and the standby feed is failed too. \
The alternative list must be reported as unusable rather than silently \
succeeding; the root causes are the cycle on bus-1 (the first alternative) and \
the unavailable standby feed. The charger cannot be made usable, so the bus \
breaker cannot be replaced and the pump cannot be restored."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["common-cause"]
[case.patch]
asset_status = { "bus-1" = "failed", "emergency-bus" = "failed" }
asset_requires = { "charger-1" = [] }
asset_requires_any = { "charger-1" = ["bus-1", "emergency-bus"] }

[[case.patch.add_asset]]
id = "emergency-bus"
kind = "power-bus"
status = "available"
description = "Standby feed for charger-1, case-only; patched to failed."

[case.expect]
verdict = "blocked"
root_causes = [
  { kind = "cycle", subject = "bus-1" },
  { kind = "asset_unavailable", subject = "emergency-bus" },
]

# --- M2.2 multi-source top-up (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S13"
title = "Two partial sources together cover the sleeve shortfall"
description = """
Obtain 3 sleeves: 1 accepted in stock, so 2 must be produced. Bronze is cut to \
2 kg, enough for only one machined raw sleeve (1.2 kg per run); a case-only \
inspection station can accept one pre-formed blank from its own 1-item lot. \
Neither process can cover both missing sleeves alone, so the solver must top up \
from both. Expected: candidate via turn-sleeve-p1 + inspect-sleeve-p1 and \
inspect-blank."""
goal = { obtain = { resource = "sleeve-p1", quantity = "3 item" } }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-bronze" = "2 kg" }

[[case.patch.add_resource]]
id = "sleeve-blank"
unit = "item"
mass_per_unit = "0.8 kg"

[[case.patch.add_lot]]
id = "lot-blank"
resource = "sleeve-blank"
quantity = "1 item"
quality = "accepted"

[[case.patch.add_process]]
id = "inspect-blank"
description = "Case-only second source: accept a pre-formed blank. Not part of the v0.1 base model."
inputs = [
  { resource = "sleeve-blank", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.1 kWh" },
]
outputs = [{ resource = "sleeve-p1", quantity = "1 item" }]
occupies = ["gauge-1"]
requires_capabilities = ["material-handling"]
verification = "demonstrated"

[case.expect]
verdict = "candidate"
route_includes = ["turn-sleeve-p1", "inspect-sleeve-p1", "inspect-blank"]

[[case]]
id = "S14"
title = "Multi-source top-up is reported as blocked when the total capacity is short"
description = """
Same two partial sources as S13, but 4 sleeves are requested: 1 in stock plus at \
most 1 machined and 1 from the blank lot = 3. Topping up must stop and report the \
two source-level root causes, not a false candidate. Expected: blocked with \
missing_resource bronze-bar and missing_resource sleeve-blank."""
goal = { obtain = { resource = "sleeve-p1", quantity = "4 item" } }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-bronze" = "2 kg" }

[[case.patch.add_resource]]
id = "sleeve-blank"
unit = "item"
mass_per_unit = "0.8 kg"

[[case.patch.add_lot]]
id = "lot-blank"
resource = "sleeve-blank"
quantity = "1 item"
quality = "accepted"

[[case.patch.add_process]]
id = "inspect-blank"
description = "Case-only second source: accept a pre-formed blank. Not part of the v0.1 base model."
inputs = [
  { resource = "sleeve-blank", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.1 kWh" },
]
outputs = [{ resource = "sleeve-p1", quantity = "1 item" }]
occupies = ["gauge-1"]
requires_capabilities = ["material-handling"]
verification = "demonstrated"

[case.expect]
verdict = "blocked"
root_causes = [
  { kind = "missing_resource", subject = "bronze-bar" },
  { kind = "missing_resource", subject = "sleeve-blank" },
]

# --- M2.3 degraded-use policy (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S15"
title = "A degraded lathe may still turn one nut under policy"
description = """
lathe-1 is degraded but the policy allows turn-lathe-nut to occupy it, capped at \
one occupation per route. One nut is requested, so the degraded asset can be used \
without repairing it first. Expected: candidate via turn-lathe-nut, with the step \
marked as using a degraded asset."""
goal = { obtain = { resource = "lathe-nut", quantity = "1 item" } }
min_verification = "modeled"
tags = ["other"]
[case.patch]
asset_status = { "lathe-1" = "degraded" }
asset_degraded = { "lathe-1" = { occupiable = true, allowed_processes = ["turn-lathe-nut"], max_occupations = 1 } }
[case.expect]
verdict = "candidate"
route_includes = ["turn-lathe-nut"]

[[case]]
id = "S16"
title = "The degraded-occupation cap cannot be exceeded on one route"
description = """
Same policy as S15, but two nuts are requested. Each nut needs one occupation of \
the degraded lathe, and the policy allows only one per route, so the second run \
must be refused rather than silently over-using the degraded asset. Expected: \
blocked with a degraded_restriction root cause on lathe-1 (no other process makes \
lathe-nut)."""
goal = { obtain = { resource = "lathe-nut", quantity = "2 item" } }
min_verification = "modeled"
tags = ["other"]
[case.patch]
asset_status = { "lathe-1" = "degraded" }
asset_degraded = { "lathe-1" = { occupiable = true, allowed_processes = ["turn-lathe-nut"], max_occupations = 1 } }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "degraded_restriction", subject = "lathe-1" }]

# --- M2.4 conservative yield and rework (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S17"
title = "50% yield needs two sleeves of raw stock, so the bronze budget runs out"
description = """
The deterministic inspection process is downgraded to declared, and a case-only \
inspection process with a conservative yield of 0.5 replaces it: one good sleeve \
now costs two raw sleeves and two turning runs. Bronze is 2 kg, enough for one \
1.2 kg turning run, not two (2.4 kg). Naively assuming 1:1 would report a false \
candidate; conservative allocation must report the blocked route. Expected: \
blocked with missing_resource bronze-bar."""
goal = { obtain = { resource = "sleeve-p1", quantity = "1 item" } }
min_verification = "demonstrated"
tags = ["quality-gate"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item", "lot-bronze" = "2 kg" }
process_verification = { "inspect-sleeve-p1" = "declared" }

[[case.patch.add_resource]]
id = "sleeve-p1-reject"
unit = "item"
mass_per_unit = "0.8 kg"

[[case.patch.add_process]]
id = "inspect-sleeve-yield"
description = "Case-only inspection with 50% planned yield; rejects are a separate resource."
inputs = [
  { resource = "sleeve-p1-raw", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.1 kWh" },
]
outputs = [{ resource = "sleeve-p1", quantity = "1 item" }]
occupies = ["gauge-1"]
requires_capabilities = ["material-handling"]
verification = "demonstrated"
yield = { output = "sleeve-p1", fraction = 0.5, reject = "sleeve-p1-reject" }

[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "bronze-bar" }]

[[case]]
id = "S18"
title = "Rejected sleeves are reworked back into raw sleeves"
description = """
No bronze is available and no raw sleeve is in stock, but two rejected sleeves \
from a previous batch are. The rework process turns each reject back into a raw \
sleeve, and the 50%-yield inspection then converts two raw sleeves into one good \
sleeve. Expected: candidate whose route reworks the rejects first, then inspects; \
at least two steps (rework-sleeve-p1, inspect-sleeve-yield)."""
goal = { obtain = { resource = "sleeve-p1", quantity = "1 item" } }
min_verification = "demonstrated"
tags = ["quality-gate"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item", "lot-bronze" = "0 kg" }
process_verification = { "inspect-sleeve-p1" = "declared" }

[[case.patch.add_resource]]
id = "sleeve-p1-reject"
unit = "item"
mass_per_unit = "0.8 kg"

[[case.patch.add_lot]]
id = "lot-reject"
resource = "sleeve-p1-reject"
quantity = "2 item"
quality = "accepted"

[[case.patch.add_process]]
id = "inspect-sleeve-yield"
description = "Case-only inspection with 50% planned yield; rejects are a separate resource."
inputs = [
  { resource = "sleeve-p1-raw", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.1 kWh" },
]
outputs = [{ resource = "sleeve-p1", quantity = "1 item" }]
occupies = ["gauge-1"]
requires_capabilities = ["material-handling"]
verification = "demonstrated"
yield = { output = "sleeve-p1", fraction = 0.5, reject = "sleeve-p1-reject" }

[[case.patch.add_process]]
id = "rework-sleeve-p1"
description = "Case-only rework route: a rejected sleeve becomes a raw sleeve again."
inputs = [
  { resource = "sleeve-p1-reject", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.5 kWh" },
]
outputs = [{ resource = "sleeve-p1-raw", quantity = "1 item" }]
verification = "demonstrated"

[case.expect]
verdict = "candidate"
route_includes = ["rework-sleeve-p1", "inspect-sleeve-yield"]

# --- M2.5 capability-level verification (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S19"
title = "The robot's sleeve-replacement skill is only declared"
description = """
The process replace-sleeve-p1 is verified, but the robot only claims the \
sleeve-replacement capability at declared level: the skill itself has no \
demonstration evidence. With min_verification = demonstrated, the provider must \
be rejected even though the process is verified. Expected: blocked with \
capability_below_verification on sleeve-replacement."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["verification"]
[case.patch]
asset_capability_verification = { "robot-m1" = { "sleeve-replacement" = "declared" } }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "capability_below_verification", subject = "sleeve-replacement" }]

[[case]]
id = "S20"
title = "The same skill at modeled level passes a modeled threshold"
description = """
Same patch idea as S19, but the robot claims sleeve-replacement at modeled level \
and the query asks only for modeled. The verified process is now usable, and the \
route's weakest verification is the capability level (modeled), not the process \
level. Expected: candidate via replace-sleeve-p1."""
goal = { service = "potable-water" }
min_verification = "modeled"
tags = ["verification"]
[case.patch]
asset_capability_verification = { "robot-m1" = { "sleeve-replacement" = "modeled" } }
[case.expect]
verdict = "candidate"
route_includes = ["replace-sleeve-p1"]

# --- M2.6 multi-route enumeration (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S21"
title = "Two distinct structural routes reach one sleeve"
description = """
With no sleeve in stock, two producers can supply it: the machining route \
(turn + inspect) and a case-only inspection of a pre-formed blank. The default \
solve picks the machining route; enumeration must find both and summarise each \
route's consumption, external dependencies and weakest verification. Expected: \
candidate, at least 2 distinct routes."""
goal = { obtain = { resource = "sleeve-p1", quantity = "1 item" } }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }

[[case.patch.add_resource]]
id = "sleeve-blank"
unit = "item"
mass_per_unit = "0.8 kg"

[[case.patch.add_lot]]
id = "lot-blank"
resource = "sleeve-blank"
quantity = "1 item"
quality = "accepted"

[[case.patch.add_process]]
id = "inspect-blank"
description = "Case-only second source: accept a pre-formed blank. Not part of the v0.1 base model."
inputs = [
  { resource = "sleeve-blank", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.1 kWh" },
]
outputs = [{ resource = "sleeve-p1", quantity = "1 item" }]
occupies = ["gauge-1"]
requires_capabilities = ["material-handling"]
verification = "demonstrated"

[case.expect]
verdict = "candidate"
route_includes = ["turn-sleeve-p1", "inspect-sleeve-p1"]
min_routes = 2

[[case]]
id = "S22"
title = "Enumeration does not fabricate extra routes"
description = """
The baseline water service has exactly one structural route: one spare sleeve \
and one restorer for the pump. Enumeration must not invent alternatives just \
because it was asked for several; at most one distinct route exists. Expected: \
candidate with at most 1 route."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["other"]
[case.expect]
verdict = "candidate"
route_includes = ["replace-sleeve-p1"]
max_routes = 1

# --- M2.7 external-dependency trace (added 2026-10-31; expectations written before the first run) ---

[[case]]
id = "S23"
title = "External dependencies are unioned over all candidate routes"
description = """
Two candidate routes reach the water service: the machining route (needs bronze \
bar and cutting inserts) and the pre-formed blank route (needs sleeve blanks). \
Neither route alone exposes the other's dependency; the report must union them, \
including indirect consumables such as cutting inserts and grease. Expected: \
candidate with external dependencies from both routes."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }

[[case.patch.add_resource]]
id = "sleeve-blank"
unit = "item"
mass_per_unit = "0.8 kg"

[[case.patch.add_lot]]
id = "lot-blank"
resource = "sleeve-blank"
quantity = "1 item"
quality = "accepted"

[[case.patch.add_process]]
id = "inspect-blank"
description = "Case-only second source: accept a pre-formed blank. Not part of the v0.1 base model."
inputs = [
  { resource = "sleeve-blank", quantity = "1 item" },
  { resource = "electric-energy", quantity = "0.1 kWh" },
]
outputs = [{ resource = "sleeve-p1", quantity = "1 item" }]
occupies = ["gauge-1"]
requires_capabilities = ["material-handling"]
verification = "demonstrated"

[case.expect]
verdict = "candidate"
min_routes = 2
external_dependencies = ["bronze-bar", "cutting-insert", "sleeve-blank", "grease", "electric-energy"]

[[case]]
id = "S24"
title = "A blocked service still reports the external input it is missing"
description = """
No sleeve in stock and no cutting inserts: the only route to a sleeve needs \
inserts, and inserts are external (no local production). There is no candidate \
route, so the trace must fall back to the blocked root causes and report the \
external cutting-insert dependency, not stay silent. Expected: blocked with \
external_dependencies = [cutting-insert]."""
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item", "lot-insert" = "0 item" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "cutting-insert" }]
external_dependencies = ["cutting-insert"]


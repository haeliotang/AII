[[case]]
id = "S29"
title = "Turning is only declared, the query requires verified"
description = "Without a spare the machining route is needed, but turn-sleeve-p1 is declared while min_verification is verified."
goal = { service = "potable-water" }
min_verification = "verified"
tags = ["verification"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }
process_verification = { "turn-sleeve-p1" = "declared" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "below_verification", subject = "turn-sleeve-p1" }]

[[case]]
id = "S30"
title = "Turn verified but the robot's machine-tending skill is demonstrated"
description = "The turning process itself is verified, but the robot only provides machine-tending at demonstrated level, below the verified threshold."
goal = { service = "potable-water" }
min_verification = "verified"
tags = ["verification"]
[case.patch]
lot_quantity = { "lot-sleeve-01" = "0 item" }
process_verification = { "turn-sleeve-p1" = "verified" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "capability_below_verification", subject = "machine-tending" }]

[[case]]
id = "S31"
title = "Restoring the lathe needs the lathe itself"
description = "The failed lathe can only get a new cross-slide nut from itself, and no nut is in stock. The turning process is only modeled, so the threshold is modeled."
goal = { restore = "lathe-1" }
min_verification = "modeled"
tags = ["cycle"]
[case.patch]
asset_status = { "lathe-1" = "failed" }
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "cycle", subject = "lathe-1" }]

[[case]]
id = "S32"
title = "Bus failure with no spare breaker"
description = "The bus is failed and the breaker store is empty: the common-cause cycle is blocked and a missing external breaker is reported."
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["common-cause"]
[case.patch]
asset_status = { "bus-1" = "failed" }
lot_quantity = { "lot-breaker" = "0 item" }
[case.expect]
verdict = "blocked"
root_causes = [
  { kind = "cycle", subject = "bus-1" },
  { kind = "missing_resource", subject = "breaker-b1" },
]

[[case]]
id = "S33"
title = "Unknown filter status is not healthy"
description = "The filter unit's status evidence is missing; restoring it cannot be claimed."
goal = { restore = "filter-1" }
min_verification = "demonstrated"
tags = ["unknown"]
[case.patch]
asset_status = { "filter-1" = "unknown" }
[case.expect]
verdict = "unknown"
root_causes = [{ kind = "unknown_state", subject = "filter-1" }]

[[case]]
id = "S34"
title = "Unknown bus status propagates through the pump"
description = "The pump depends on the bus; with the bus status unknown the water service is unknown, not failed."
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["unknown"]
[case.patch]
asset_status = { "bus-1" = "unknown" }
[case.expect]
verdict = "unknown"
root_causes = [{ kind = "unknown_state", subject = "bus-1" }]

[[case]]
id = "S35"
title = "Turn a lathe nut while the lathe is healthy"
description = "A direct structural candidate: the healthy lathe can turn a replacement cross-slide nut."
goal = { obtain = { resource = "lathe-nut", quantity = "1 item" } }
min_verification = "modeled"
tags = ["other"]
[case.expect]
verdict = "candidate"
route_includes = ["turn-lathe-nut"]

[[case]]
id = "S36"
title = "Degraded lathe allowed to turn two nuts under policy"
description = "The lathe is degraded but the policy allows turn-lathe-nut to occupy it up to two times on one route."
goal = { obtain = { resource = "lathe-nut", quantity = "2 item" } }
min_verification = "modeled"
tags = ["other"]
[case.patch]
asset_status = { "lathe-1" = "degraded" }
asset_degraded = { "lathe-1" = { occupiable = true, allowed_processes = ["turn-lathe-nut"], max_occupations = 2 } }
[case.expect]
verdict = "candidate"
route_includes = ["turn-lathe-nut"]

[[case]]
id = "S37"
title = "Bronze bar itself is an irreducible external input"
description = "Asking for more bronze than the 3 kg in stock can only be answered by external input."
goal = { obtain = { resource = "bronze-bar", quantity = "5 kg" } }
min_verification = "demonstrated"
tags = ["other"]
[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "bronze-bar" }]

[[case]]
id = "S38"
title = "Two machined sleeves plus one from stock"
description = "Three sleeves are requested: one in stock, two machined; bronze (3 kg) covers two turning runs (2.4 kg)."
goal = { obtain = { resource = "sleeve-p1", quantity = "3 item" } }
min_verification = "demonstrated"
tags = ["stock-contention"]
[case.expect]
verdict = "candidate"
route_includes = ["turn-sleeve-p1", "inspect-sleeve-p1"]

[[case]]
id = "S39"
title = "Emergency feed unblocks the cycle but not the missing breaker"
description = "The charger has an emergency feed, so the robot can work during the bus failure, but there is no spare breaker to replace."
goal = { service = "potable-water" }
min_verification = "demonstrated"
tags = ["common-cause"]
[case.patch]
asset_status = { "bus-1" = "failed" }
lot_quantity = { "lot-breaker" = "0 item" }
asset_requires = { "charger-1" = [] }
asset_requires_any = { "charger-1" = ["bus-1", "emergency-bus"] }

[[case.patch.add_asset]]
id = "emergency-bus"
kind = "power-bus"
status = "available"
description = "Standby feed for charger-1, case-only. Not part of the v0.2 base model."

[case.expect]
verdict = "blocked"
root_causes = [{ kind = "missing_resource", subject = "breaker-b1" }]

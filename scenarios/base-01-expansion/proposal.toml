# Base-01 expansion proposal: chip-recycling furnace (M11.4, synthetic)
# Adds a furnace and a remelting process that turns the site's historical
# bronze-swarf stockpile into usable bronze bar. Construction, commissioning,
# upkeep, external inputs and bootstrap are declared per VEC §6.1.
#
# Revised 2026-11-01 (issue #109, VEC §6.1–6.3): the additions describe the
# planned post-commissioning state; before construction completes they do not
# exist, and until commissioning they enter at their current level (modeled).
# The commissioning target is the Base-01 operating threshold (demonstrated),
# not a level chosen by the proposer; the furnace declares its own failure
# mechanism so that the expanded branch carries it.

schema = "poie.expansion-proposal/0.1"
id = "recycle-furnace"
title = "Chip-recycling furnace"
description = "A small induction furnace that remelts the historical bronze swarf stockpile into bronze bar."

[adds]

[[adds.resources]]
id = "bronze-dross"
unit = "kg"
description = "Oxidised dross skimmed from remelting; waste, not reusable on site."

[[adds.assets]]
id = "furnace-1"
kind = "furnace"
status = "available"
provides = ["scrap-recycling"]
capability_verification = { "scrap-recycling" = "modeled" }
description = "Small induction furnace. Not built: status is the planned post-commissioning state; the capability is modeled until commissioning."

[[adds.lots]]
id = "lot-swarf-stock"
resource = "bronze-swarf"
quantity = "4 kg"
quality = "accepted"
location = "yard"
evidence = "historical stockpile; synthetic"

[[adds.processes]]
id = "remelt-swarf"
description = "Remelt bronze swarf into bar stock; mass loss to dross is 12.5%."
inputs = [
  { resource = "bronze-swarf", quantity = "4 kg" },
  { resource = "electric-energy", quantity = "4 kWh" },
]
outputs = [
  { resource = "bronze-bar", quantity = "3.5 kg" },
  { resource = "bronze-dross", quantity = "0.5 kg" },
]
occupies = ["furnace-1"]
requires_capabilities = ["scrap-recycling"]
duration = "2 h"
verification = "modeled"

[construction]
duration = "8 h"
resources = [
  { resource = "bronze-bar", quantity = "1 kg" },
  { resource = "electric-energy", quantity = "20 kWh" },
]
energy = "20 kWh"
assets = ["robot-m1", "lathe-1"]
goals = ["build furnace", "inspect furnace"]

[commissioning]
# Must reach the operating threshold of Base-01 planning (demonstrated) before
# the furnace can be used in operation (VEC §6.3).
required_verification = "demonstrated"
inspection_method = "sample remelt mass balance + temperature log"

[upkeep]
resources = [{ resource = "electric-energy", quantity = "5 kWh" }]
processes = ["inspect-furnace"]

[[external_inputs]]
resource = "furnace-module"
quantity = "1 item"

[bootstrap]
assets = ["robot-m1"]
resources = [{ resource = "bronze-bar", quantity = "1 kg" }]

# Failure mechanism of the added asset (VEC §2.3, §6.2). Synthetic MTBF.
[[failure_modes]]
asset = "furnace-1"
mtbf = "500 h"
synthetic = true
source = "synthetic assumption, review C-08 example; not calibrated"

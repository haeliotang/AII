[package]
name = "poieweave-desktop"
version = "0.1.0"
description = "Poieweave desktop host: filesystem sandbox, SQLite state, Tauri 2 packaging."
edition = "2021"
rust-version = "1.77"
publish = false
license-file = "../../../LICENSE"

[lib]
name = "poieweave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Poieweave"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

[workspace]

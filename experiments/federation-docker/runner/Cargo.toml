[package]
name = "poie-federation-docker"
version = "0.1.0"
description = "Two-container network-partition federation preview (M12.6 AI preview, not real multi-node)."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
poie-federation = { path = "../../../crates/poie-federation", version = "0.1.0" }
